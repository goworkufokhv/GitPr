version: '3.9'

services:
  web:
    build: .
    container_name: web
    command: gunicorn lotto_site.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/code
    working_dir: /code
    ports:
      - '8000:8000'
    environment:
      DJANGO_SETTINGS_MODULE: lotto_site.settings
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_DB: lotto_db
      POSTGRES_USER: lotto_user
      POSTGRES_PASSWORD: lotto_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/static # collectstatic 결과를 여기로 모아두고 Nginx가 서빙
    depends_on:
      - web

volumes:
  postgres_data:
